[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dynamic-task-conveyor-roller-runout"
version = "0.1.0"
requires-python = ">=3.12"
[project.entry-points."inspect_robots.embodiments"]
conveyor_roller_runout_yam = "dynamic_task_conveyor_roller_runout.yam_dynamic:make_embodiment"
[project.entry-points."inspect_robots.policies"]
conveyor_roller_runout_demo = "dynamic_task_conveyor_roller_runout.yam_dynamic:make_scripted_policy"
conveyor_roller_runout_idle = "dynamic_task_conveyor_roller_runout.yam_dynamic:make_idle_policy"
conveyor_roller_runout_dream_guard = "dynamic_task_conveyor_roller_runout.budget:make_guarded_dream_policy"
[tool.setuptools.packages.find]
include = ["dynamic_task_conveyor_roller_runout*"]
