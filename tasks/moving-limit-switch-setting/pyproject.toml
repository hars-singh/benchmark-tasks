[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dynamic-task-moving-limit-switch-setting"
version = "0.1.0"
requires-python = ">=3.12"
[project.entry-points."inspect_robots.embodiments"]
moving_limit_switch_setting_yam = "dynamic_task_moving_limit_switch_setting.yam_dynamic:make_embodiment"
[project.entry-points."inspect_robots.policies"]
moving_limit_switch_setting_demo = "dynamic_task_moving_limit_switch_setting.yam_dynamic:make_scripted_policy"
moving_limit_switch_setting_idle = "dynamic_task_moving_limit_switch_setting.yam_dynamic:make_idle_policy"
moving_limit_switch_setting_dream_guard = "dynamic_task_moving_limit_switch_setting.budget:make_guarded_dream_policy"
[tool.setuptools.packages.find]
include = ["dynamic_task_moving_limit_switch_setting*"]
