[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dynamic-task-churn-mix-in-dosing"
version = "0.1.0"
requires-python = ">=3.12"
[project.entry-points."inspect_robots.embodiments"]
churn_mix_in_dosing_yam = "dynamic_task_churn_mix_in_dosing.yam_dynamic:make_embodiment"
[project.entry-points."inspect_robots.policies"]
churn_mix_in_dosing_demo = "dynamic_task_churn_mix_in_dosing.yam_dynamic:make_scripted_policy"
churn_mix_in_dosing_idle = "dynamic_task_churn_mix_in_dosing.yam_dynamic:make_idle_policy"
churn_mix_in_dosing_dream_guard = "dynamic_task_churn_mix_in_dosing.budget:make_guarded_dream_policy"
[tool.setuptools.packages.find]
include = ["dynamic_task_churn_mix_in_dosing*"]
