[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dynamic-task-overhead-hanger-unloading"
version = "0.1.0"
requires-python = ">=3.12"
[project.entry-points."inspect_robots.embodiments"]
overhead_hanger_unloading_yam = "dynamic_task_overhead_hanger_unloading.yam_dynamic:make_embodiment"
[project.entry-points."inspect_robots.policies"]
overhead_hanger_unloading_demo = "dynamic_task_overhead_hanger_unloading.yam_dynamic:make_scripted_policy"
overhead_hanger_unloading_idle = "dynamic_task_overhead_hanger_unloading.yam_dynamic:make_idle_policy"
overhead_hanger_unloading_dream_guard = "dynamic_task_overhead_hanger_unloading.budget:make_guarded_dream_policy"
[tool.setuptools.packages.find]
include = ["dynamic_task_overhead_hanger_unloading*"]
