[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dynamic-task-window-screen-spline-corner"
version = "0.1.0"
requires-python = ">=3.12"
[project.entry-points."inspect_robots.embodiments"]
window_screen_spline_corner_yam = "dynamic_task_window_screen_spline_corner.yam_dynamic:make_embodiment"
[project.entry-points."inspect_robots.policies"]
window_screen_spline_corner_demo = "dynamic_task_window_screen_spline_corner.yam_dynamic:make_scripted_policy"
window_screen_spline_corner_idle = "dynamic_task_window_screen_spline_corner.yam_dynamic:make_idle_policy"
window_screen_spline_corner_dream_guard = "dynamic_task_window_screen_spline_corner.budget:make_guarded_dream_policy"
[tool.setuptools.packages.find]
include = ["dynamic_task_window_screen_spline_corner*"]
