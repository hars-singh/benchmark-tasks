[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dynamic-task-servo-horn-neutral-check"
version = "0.1.0"
requires-python = ">=3.12"
[project.entry-points."inspect_robots.embodiments"]
servo_horn_neutral_check_yam = "dynamic_task_servo_horn_neutral_check.yam_dynamic:make_embodiment"
[project.entry-points."inspect_robots.policies"]
servo_horn_neutral_check_demo = "dynamic_task_servo_horn_neutral_check.yam_dynamic:make_scripted_policy"
servo_horn_neutral_check_idle = "dynamic_task_servo_horn_neutral_check.yam_dynamic:make_idle_policy"
servo_horn_neutral_check_dream_guard = "dynamic_task_servo_horn_neutral_check.budget:make_guarded_dream_policy"
[tool.setuptools.packages.find]
include = ["dynamic_task_servo_horn_neutral_check*"]
