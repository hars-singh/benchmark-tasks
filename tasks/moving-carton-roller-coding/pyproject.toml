[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dynamic-task-moving-carton-roller-coding"
version = "0.1.0"
requires-python = ">=3.12"
[project.entry-points."inspect_robots.embodiments"]
moving_carton_roller_coding_yam = "dynamic_task_moving_carton_roller_coding.yam_dynamic:make_embodiment"
[project.entry-points."inspect_robots.policies"]
moving_carton_roller_coding_demo = "dynamic_task_moving_carton_roller_coding.yam_dynamic:make_scripted_policy"
moving_carton_roller_coding_idle = "dynamic_task_moving_carton_roller_coding.yam_dynamic:make_idle_policy"
moving_carton_roller_coding_dream_guard = "dynamic_task_moving_carton_roller_coding.budget:make_guarded_dream_policy"
[tool.setuptools.packages.find]
include = ["dynamic_task_moving_carton_roller_coding*"]
