[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dynamic-task-opulo-index-recovery"
version = "0.1.0"
requires-python = ">=3.12"
[project.entry-points."inspect_robots.embodiments"]
opulo_index_recovery_yam = "dynamic_task_opulo_index_recovery.yam_dynamic:make_embodiment"
[project.entry-points."inspect_robots.policies"]
opulo_index_recovery_demo = "dynamic_task_opulo_index_recovery.yam_dynamic:make_scripted_policy"
opulo_index_recovery_idle = "dynamic_task_opulo_index_recovery.yam_dynamic:make_idle_policy"
opulo_index_recovery_dream_guard = "dynamic_task_opulo_index_recovery.budget:make_guarded_dream_policy"
[tool.setuptools.packages.find]
include = ["dynamic_task_opulo_index_recovery*"]
