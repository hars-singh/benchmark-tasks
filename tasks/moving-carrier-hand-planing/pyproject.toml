[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dynamic-task-moving-carrier-hand-planing"
version = "0.1.0"
requires-python = ">=3.12"
[project.entry-points."inspect_robots.embodiments"]
moving_carrier_hand_planing_yam = "dynamic_task_moving_carrier_hand_planing.yam_dynamic:make_embodiment"
[project.entry-points."inspect_robots.policies"]
moving_carrier_hand_planing_demo = "dynamic_task_moving_carrier_hand_planing.yam_dynamic:make_scripted_policy"
moving_carrier_hand_planing_idle = "dynamic_task_moving_carrier_hand_planing.yam_dynamic:make_idle_policy"
moving_carrier_hand_planing_dream_guard = "dynamic_task_moving_carrier_hand_planing.budget:make_guarded_dream_policy"
[tool.setuptools.packages.find]
include = ["dynamic_task_moving_carrier_hand_planing*"]
