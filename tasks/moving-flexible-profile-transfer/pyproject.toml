[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dynamic-task-moving-flexible-profile-transfer"
version = "0.1.0"
requires-python = ">=3.12"
[project.entry-points."inspect_robots.embodiments"]
moving_flexible_profile_transfer_yam = "dynamic_task_moving_flexible_profile_transfer.yam_dynamic:make_embodiment"
[project.entry-points."inspect_robots.policies"]
moving_flexible_profile_transfer_demo = "dynamic_task_moving_flexible_profile_transfer.yam_dynamic:make_scripted_policy"
moving_flexible_profile_transfer_idle = "dynamic_task_moving_flexible_profile_transfer.yam_dynamic:make_idle_policy"
moving_flexible_profile_transfer_dream_guard = "dynamic_task_moving_flexible_profile_transfer.budget:make_guarded_dream_policy"
[tool.setuptools.packages.find]
include = ["dynamic_task_moving_flexible_profile_transfer*"]
