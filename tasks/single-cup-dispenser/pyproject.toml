[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dynamic-task-single-cup-dispenser"
version = "0.1.0"
requires-python = ">=3.12"
[project.entry-points."inspect_robots.embodiments"]
single_cup_dispenser_yam = "dynamic_task_single_cup_dispenser.yam_dynamic:make_embodiment"
[project.entry-points."inspect_robots.policies"]
single_cup_dispenser_demo = "dynamic_task_single_cup_dispenser.yam_dynamic:make_scripted_policy"
single_cup_dispenser_idle = "dynamic_task_single_cup_dispenser.yam_dynamic:make_idle_policy"
single_cup_dispenser_dream_guard = "dynamic_task_single_cup_dispenser.budget:make_guarded_dream_policy"
[tool.setuptools.packages.find]
include = ["dynamic_task_single_cup_dispenser*"]
