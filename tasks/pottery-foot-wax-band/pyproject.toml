[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dynamic-task-pottery-foot-wax-band"
version = "0.1.0"
requires-python = ">=3.12"
[project.entry-points."inspect_robots.embodiments"]
pottery_foot_wax_band_yam = "dynamic_task_pottery_foot_wax_band.yam_dynamic:make_embodiment"
[project.entry-points."inspect_robots.policies"]
pottery_foot_wax_band_demo = "dynamic_task_pottery_foot_wax_band.yam_dynamic:make_scripted_policy"
pottery_foot_wax_band_idle = "dynamic_task_pottery_foot_wax_band.yam_dynamic:make_idle_policy"
pottery_foot_wax_band_dream_guard = "dynamic_task_pottery_foot_wax_band.budget:make_guarded_dream_policy"
[tool.setuptools.packages.find]
include = ["dynamic_task_pottery_foot_wax_band*"]
