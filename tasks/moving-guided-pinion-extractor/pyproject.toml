[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dynamic-task-moving-guided-pinion-extractor"
version = "0.1.0"
requires-python = ">=3.12"
[project.entry-points."inspect_robots.embodiments"]
moving_guided_pinion_extractor_yam = "dynamic_task_moving_guided_pinion_extractor.yam_dynamic:make_embodiment"
[project.entry-points."inspect_robots.policies"]
moving_guided_pinion_extractor_demo = "dynamic_task_moving_guided_pinion_extractor.yam_dynamic:make_scripted_policy"
moving_guided_pinion_extractor_idle = "dynamic_task_moving_guided_pinion_extractor.yam_dynamic:make_idle_policy"
moving_guided_pinion_extractor_dream_guard = "dynamic_task_moving_guided_pinion_extractor.budget:make_guarded_dream_policy"
[tool.setuptools.packages.find]
include = ["dynamic_task_moving_guided_pinion_extractor*"]
