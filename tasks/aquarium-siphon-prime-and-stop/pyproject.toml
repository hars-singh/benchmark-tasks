[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dynamic-task-aquarium-siphon-prime-and-stop"
version = "0.1.0"
requires-python = ">=3.12"
[project.entry-points."inspect_robots.embodiments"]
aquarium_siphon_prime_and_stop_yam = "dynamic_task_aquarium_siphon_prime_and_stop.yam_dynamic:make_embodiment"
[project.entry-points."inspect_robots.policies"]
aquarium_siphon_prime_and_stop_demo = "dynamic_task_aquarium_siphon_prime_and_stop.yam_dynamic:make_scripted_policy"
aquarium_siphon_prime_and_stop_idle = "dynamic_task_aquarium_siphon_prime_and_stop.yam_dynamic:make_idle_policy"
aquarium_siphon_prime_and_stop_dream_guard = "dynamic_task_aquarium_siphon_prime_and_stop.budget:make_guarded_dream_policy"
[tool.setuptools.packages.find]
include = ["dynamic_task_aquarium_siphon_prime_and_stop*"]
