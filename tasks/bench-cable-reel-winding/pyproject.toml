[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dynamic-task-bench-cable-reel-winding"
version = "0.1.0"
requires-python = ">=3.12"
[project.entry-points."inspect_robots.embodiments"]
bench_cable_reel_winding_yam = "dynamic_task_bench_cable_reel_winding.yam_dynamic:make_embodiment"
[project.entry-points."inspect_robots.policies"]
bench_cable_reel_winding_demo = "dynamic_task_bench_cable_reel_winding.yam_dynamic:make_scripted_policy"
bench_cable_reel_winding_idle = "dynamic_task_bench_cable_reel_winding.yam_dynamic:make_idle_policy"
bench_cable_reel_winding_dream_guard = "dynamic_task_bench_cable_reel_winding.budget:make_guarded_dream_policy"
[tool.setuptools.packages.find]
include = ["dynamic_task_bench_cable_reel_winding*"]
