[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dynamic-task-moving-suspended-load-damping"
version = "0.1.0"
requires-python = ">=3.12"
[project.entry-points."inspect_robots.embodiments"]
moving_suspended_load_damping_yam = "dynamic_task_moving_suspended_load_damping.yam_dynamic:make_embodiment"
[project.entry-points."inspect_robots.policies"]
moving_suspended_load_damping_demo = "dynamic_task_moving_suspended_load_damping.yam_dynamic:make_scripted_policy"
moving_suspended_load_damping_idle = "dynamic_task_moving_suspended_load_damping.yam_dynamic:make_idle_policy"
moving_suspended_load_damping_dream_guard = "dynamic_task_moving_suspended_load_damping.budget:make_guarded_dream_policy"
[tool.setuptools.packages.find]
include = ["dynamic_task_moving_suspended_load_damping*"]
