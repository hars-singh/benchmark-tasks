[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dynamic-task-moving-board-hot-air-inductor"
version = "0.1.0"
requires-python = ">=3.12"
[project.entry-points."inspect_robots.embodiments"]
moving_board_hot_air_inductor_yam = "dynamic_task_moving_board_hot_air_inductor.yam_dynamic:make_embodiment"
[project.entry-points."inspect_robots.policies"]
moving_board_hot_air_inductor_demo = "dynamic_task_moving_board_hot_air_inductor.yam_dynamic:make_scripted_policy"
moving_board_hot_air_inductor_idle = "dynamic_task_moving_board_hot_air_inductor.yam_dynamic:make_idle_policy"
moving_board_hot_air_inductor_dream_guard = "dynamic_task_moving_board_hot_air_inductor.budget:make_guarded_dream_policy"
[tool.setuptools.packages.find]
include = ["dynamic_task_moving_board_hot_air_inductor*"]
