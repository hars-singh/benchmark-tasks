[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dynamic-task-magnetic-stir-recoupling"
version = "0.1.0"
requires-python = ">=3.12"
[project.entry-points."inspect_robots.embodiments"]
magnetic_stir_recoupling_yam = "dynamic_task_magnetic_stir_recoupling.yam_dynamic:make_embodiment"
[project.entry-points."inspect_robots.policies"]
magnetic_stir_recoupling_demo = "dynamic_task_magnetic_stir_recoupling.yam_dynamic:make_scripted_policy"
magnetic_stir_recoupling_idle = "dynamic_task_magnetic_stir_recoupling.yam_dynamic:make_idle_policy"
magnetic_stir_recoupling_dream_guard = "dynamic_task_magnetic_stir_recoupling.budget:make_guarded_dream_policy"
[tool.setuptools.packages.find]
include = ["dynamic_task_magnetic_stir_recoupling*"]
