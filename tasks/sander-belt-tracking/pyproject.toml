[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dynamic-task-sander-belt-tracking"
version = "0.1.0"
requires-python = ">=3.12"
[project.entry-points."inspect_robots.embodiments"]
sander_belt_tracking_yam = "dynamic_task_sander_belt_tracking.yam_dynamic:make_embodiment"
[project.entry-points."inspect_robots.policies"]
sander_belt_tracking_demo = "dynamic_task_sander_belt_tracking.yam_dynamic:make_scripted_policy"
sander_belt_tracking_idle = "dynamic_task_sander_belt_tracking.yam_dynamic:make_idle_policy"
sander_belt_tracking_dream_guard = "dynamic_task_sander_belt_tracking.budget:make_guarded_dream_policy"
[tool.setuptools.packages.find]
include = ["dynamic_task_sander_belt_tracking*"]
