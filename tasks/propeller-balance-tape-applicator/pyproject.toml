[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dynamic-task-propeller-balance-tape-applicator"
version = "0.1.0"
requires-python = ">=3.12"
[project.entry-points."inspect_robots.embodiments"]
propeller_balance_tape_applicator_yam = "dynamic_task_propeller_balance_tape_applicator.yam_dynamic:make_embodiment"
[project.entry-points."inspect_robots.policies"]
propeller_balance_tape_applicator_demo = "dynamic_task_propeller_balance_tape_applicator.yam_dynamic:make_scripted_policy"
propeller_balance_tape_applicator_idle = "dynamic_task_propeller_balance_tape_applicator.yam_dynamic:make_idle_policy"
propeller_balance_tape_applicator_dream_guard = "dynamic_task_propeller_balance_tape_applicator.budget:make_guarded_dream_policy"
[tool.setuptools.packages.find]
include = ["dynamic_task_propeller_balance_tape_applicator*"]
