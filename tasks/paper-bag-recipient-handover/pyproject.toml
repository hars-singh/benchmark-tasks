[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dynamic-task-paper-bag-recipient-handover"
version = "0.1.0"
requires-python = ">=3.12"
[project.entry-points."inspect_robots.embodiments"]
paper_bag_recipient_handover_yam = "dynamic_task_paper_bag_recipient_handover.yam_dynamic:make_embodiment"
[project.entry-points."inspect_robots.policies"]
paper_bag_recipient_handover_demo = "dynamic_task_paper_bag_recipient_handover.yam_dynamic:make_scripted_policy"
paper_bag_recipient_handover_idle = "dynamic_task_paper_bag_recipient_handover.yam_dynamic:make_idle_policy"
paper_bag_recipient_handover_dream_guard = "dynamic_task_paper_bag_recipient_handover.budget:make_guarded_dream_policy"
[tool.setuptools.packages.find]
include = ["dynamic_task_paper_bag_recipient_handover*"]
