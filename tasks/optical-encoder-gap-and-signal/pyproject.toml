[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dynamic-task-optical-encoder-gap-and-signal"
version = "0.1.0"
requires-python = ">=3.12"
[project.entry-points."inspect_robots.embodiments"]
optical_encoder_gap_and_signal_yam = "dynamic_task_optical_encoder_gap_and_signal.yam_dynamic:make_embodiment"
[project.entry-points."inspect_robots.policies"]
optical_encoder_gap_and_signal_demo = "dynamic_task_optical_encoder_gap_and_signal.yam_dynamic:make_scripted_policy"
optical_encoder_gap_and_signal_idle = "dynamic_task_optical_encoder_gap_and_signal.yam_dynamic:make_idle_policy"
optical_encoder_gap_and_signal_dream_guard = "dynamic_task_optical_encoder_gap_and_signal.budget:make_guarded_dream_policy"
[tool.setuptools.packages.find]
include = ["dynamic_task_optical_encoder_gap_and_signal*"]
